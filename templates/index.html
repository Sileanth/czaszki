<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
        }
        h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 2rem;
            font-weight: 400;
        }
        .links {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        a.btn {
            text-decoration: none;
            padding: 1rem 2rem;
            border: 1px solid #333;
            color: #333;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        a.btn:hover {
            background: #333;
            color: #fff;
        }
        .urls {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #ddd;
        }
        .urls p {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0.5rem;
        }
        .urls code {
            display: block;
            background: #fff;
            border: 1px solid #ddd;
            padding: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            word-break: break-all;
            color: #333;
        }
        .footer {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #ddd;
        }
        .footer a {
            color: #666;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .footer a:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Play Chess</h1>
        <div class="links">
            <a class="btn" href="{{ url_white }}">Play as White</a>
            <a class="btn" href="{{ url_black }}">Play as Black</a>
        </div>
        <div class="urls">
            <p>White challenge URL:</p>
            <code>{{ url_white }}</code>
            <p>Black challenge URL:</p>
            <code>{{ url_black }}</code>
        </div>
        <div class="footer">
            <a href="https://github.com/Sileanth/szaszki">GitHub</a>
        </div>
    </div>
</body>
</html>
